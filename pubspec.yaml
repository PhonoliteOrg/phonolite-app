name: phonolite_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev.
version: 0.3.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  google_fonts: ^6.3.0
  ffi: ^2.1.0
  phonolite_opus:
    path: packages/phonolite_opus
  phonolite_local_audio:
    path: packages/phonolite_local_audio
  phonolite_quic:
    path: packages/phonolite_quic
  http: ^1.2.1
  xml: ^6.6.1
  connectivity_plus: ^6.1.5
  crypto: ^3.0.6
  palette_generator: ^0.3.3
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  sqlite3: ^2.4.7
  sqlite3_flutter_libs: ^0.5.24
  file_selector: ^1.1.0
  image_picker: ^1.2.2
  flutter_secure_storage: ^9.2.4
  launch_at_startup: ^0.5.1
  tray_manager: ^0.5.3
  window_manager: ^0.5.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  vm_service: ^15.0.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/lucide/
    - assets/icons/tabler/
    - assets/images/phonolite-logo-nobackground.png
    - assets/images/phonolite-logo.png
    - assets/images/phonolite-tray.ico
  fonts:
    - family: PhonoliteLucide
      fonts:
        - asset: assets/icons/lucide/PhonoliteLucide.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rajdhani-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 21
  image_path_android: "assets/images/phonolite-logo.png"
  image_path_ios: "assets/images/phonolite-logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#060707"
  adaptive_icon_foreground: "assets/images/phonolite-logo-nobackground.png"
  adaptive_icon_foreground_inset: 28
  macos:
    generate: true
    image_path: "assets/images/phonolite-logo.png"
