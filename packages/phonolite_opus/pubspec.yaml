name: phonolite_opus
description: Opus decoder FFI bindings for Phonolite.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.2.0
  phonolite_native_build:
    path: ../phonolite_native_build

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
