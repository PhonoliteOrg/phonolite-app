group 'com.phonolite.phonolite_local_audio'
version '0.1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.phonolite.phonolite_local_audio'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 21
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}

def pluginRoot = project.projectDir.parentFile
def rustRoot = new File(pluginRoot, 'native/local_audio')
def cargoTargetDir = project.layout.buildDirectory.dir('cargo').get().asFile
def jniLibsDir = project.layout.buildDirectory.dir('jniLibs').get().asFile
android.sourceSets.main.jniLibs.srcDirs = [jniLibsDir]
def androidTargets = ['armeabi-v7a', 'arm64-v8a', 'x86_64']

tasks.register('cargoBuild') {
    doLast {
        def executableSuffix = System.getProperty('os.name').toLowerCase().contains('windows') ? '.exe' : ''
        def cmakeHomes = new File(android.sdkDirectory, 'cmake').listFiles()?.findAll {
            new File(it, "bin/cmake${executableSuffix}").isFile() &&
                    new File(it, "bin/ninja${executableSuffix}").isFile()
        } ?: []
        def cmakeHome = cmakeHomes.max {
            it.name.tokenize('.').collect { component -> component.padLeft(8, '0') }.join('.')
        }
        if (cmakeHome == null) {
            throw new GradleException('Install CMake through the Android SDK Manager to build local Opus decoding.')
        }
        def cmakeBin = new File(cmakeHome, 'bin')

        delete cargoTargetDir
        delete jniLibsDir
        jniLibsDir.mkdirs()

        androidTargets.each { abi ->
            project.exec {
                workingDir rustRoot
                environment 'CARGO_TARGET_DIR', cargoTargetDir.absolutePath
                environment 'ANDROID_NDK_HOME', android.ndkDirectory.absolutePath
                environment 'CMAKE', new File(cmakeBin, "cmake${executableSuffix}").absolutePath
                environment 'CMAKE_GENERATOR', 'Ninja'
                environment 'PATH', cmakeBin.absolutePath + File.pathSeparator + System.getenv('PATH')
                commandLine 'cargo', 'ndk',
                        '-t', abi,
                        '-o', jniLibsDir.absolutePath,
                        'build', '--release'
            }
        }
    }
}

preBuild.dependsOn tasks.named('cargoBuild')

repositories {
    google()
    mavenCentral()
}
