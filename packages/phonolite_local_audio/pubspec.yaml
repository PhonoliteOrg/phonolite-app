name: phonolite_local_audio
description: Source-preserving MP3/FLAC and Ogg Opus file decoding for Phonolite.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.9.2

dependencies:
  ffi: ^2.2.0
  phonolite_opus:
    path: ../phonolite_opus

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
