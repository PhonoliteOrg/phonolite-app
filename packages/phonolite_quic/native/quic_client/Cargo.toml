[package]
name = "phonolite_quic"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
bytes = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9.2"
quiche = { version = "0.20", default-features = false, features = ["boringssl-vendored"] }
opaque-ke = { version = "=4.0.1", features = ["argon2"] }
rand08 = { package = "rand", version = "0.8" }
argon2 = "0.5"
sha2 = "0.10"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
x509-parser = "0.18"
zeroize = "1"

[dev-dependencies]
rcgen = "0.13"
