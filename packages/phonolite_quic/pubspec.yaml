name: phonolite_quic
description: "FFI bindings for Phonolite QUIC streaming"
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.2.0
  phonolite_native_build:
    path: ../phonolite_native_build

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
